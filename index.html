<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOI Garden Cafe Menu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; padding: 1rem;
      background: radial-gradient(circle, #4a0e13, #1a0608);
      color: #f3dc8b; font-family: system-ui, sans-serif; user-select: none;
    }
    h1 { font-family: Georgia, serif; font-size: 1.3rem; letter-spacing: 2px; }
    .stage {
      width: min(92vw, 400px); aspect-ratio: 9/14.5;
      perspective: 1600px; position: relative; margin: auto;
    }
    .book { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
    .sheet {
      position: absolute; inset: 0; transform-origin: left center;
      transform-style: preserve-3d; transition: transform 0.6s ease;
      border-radius: 4px 12px 12px 4px; box-shadow: 0 15px 35px rgba(0,0,0,0.7);
    }
    .face {
      position: absolute; inset: 0; backface-visibility: hidden;
      border-radius: inherit; overflow: hidden; border: 2px solid #d4af37;
    }
    .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .back {
      transform: rotateY(180deg); background: #2b090c;
      display: grid; place-items: center; font-family: Georgia, serif;
    }
    .flipped { transform: rotateY(-165deg); }
    .nav { display: flex; gap: 1rem; align-items: center; }
    button {
      background: rgba(212,175,55,0.2); border: 1px solid #d4af37;
      color: #f3dc8b; padding: 0.5rem 1rem; border-radius: 99px; font-weight: bold;
    }
    button:disabled { opacity: 0.3; }
  </style>
</head>
<body>
  <h1>KOI GARDEN CAFE</h1>
  <div class="stage" id="stage"><div class="book" id="book"></div></div>
  <div class="nav">
    <button id="prev">← Prev</button>
    <span id="info">1 / 10</span>
    <button id="next">Next →</button>
  </div>
  <script>
    const imgs = ["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg","7.jpg","8.jpg","9.jpg","10.jpg"];
    const book = document.getElementById("book"), info = document.getElementById("info");
    let idx = 0;

    imgs.forEach((src, i) => {
      const sh = document.createElement("div");
      sh.className = "sheet";
      sh.style.zIndex = imgs.length - i;
      sh.innerHTML = `<div class="face"><img src="${src}"></div><div class="face back">KOI GARDEN CAFE</div>`;
      sh.onclick = () => i === idx && idx < 9 ? go(idx + 1) : i < idx && go(i);
      book.appendChild(sh);
    });

    const sheets = document.querySelectorAll(".sheet");
    function go(n) {
      idx = Math.max(0, Math.min(9, n));
      sheets.forEach((s, i) => {
        s.classList.toggle("flipped", i < idx);
        s.style.zIndex = i < idx ? i + 1 : 10 - i;
      });
      info.textContent = `${idx + 1} / 10`;
      prev.disabled = idx === 0;
      next.disabled = idx === 9;
    }
    prev.onclick = () => go(idx - 1);
    next.onclick = () => go(idx + 1);

    let sx = 0;
    stage.ontouchstart = e => sx = e.changedTouches[0].screenX;
    stage.ontouchend = e => {
      let d = e.changedTouches[0].screenX - sx;
      if (Math.abs(d) > 35) d < 0 ? go(idx + 1) : go(idx - 1);
    };
    go(0);
  </script>
</body>
</html>
