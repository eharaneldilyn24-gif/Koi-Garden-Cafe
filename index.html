<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOI Garden Cafe | Interactive 3D Menu</title>
  <style>
    :root {
      --bg: #1f0609;
      --crimson: #590d16;
      --gold: #d4af37;
      --gold-bright: #f3dc8b;
      --cream: #faf3dc;
      --card: #fffdf5;
      --ink: #2a1215;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0.65rem;
      background: radial-gradient(circle at top, var(--crimson), var(--bg));
      color: var(--gold-bright);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }
    header { text-align: center; }
    .sub { font-size: 0.65rem; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; }
    h1 { font-family: Georgia, serif; font-size: 1.35rem; letter-spacing: 0.08em; margin-top: 0.1rem; }

    /* Category Quick-Jump Bar */
    .tabs {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      max-width: 100%;
      padding: 0.35rem 0.2rem;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: rgba(212, 175, 55, 0.14);
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: var(--gold-bright);
      padding: 0.32rem 0.7rem;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab.active { background: var(--gold); color: #1f0609; }

    /* 3D Flipbook Stage */
    .stage {
      width: min(94vw, 410px);
      height: 520px;
      perspective: 1500px;
      position: relative;
      margin: 0.35rem auto;
    }
    .book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }
    .sheet {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.65, 0.05, 0.36, 1);
      border-radius: 4px 14px 14px 4px;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.65);
    }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 4px 14px 14px 4px;
      background: var(--cream);
      color: var(--ink);
      padding: 1rem 0.95rem;
      overflow-y: auto;
      border: 2px solid var(--gold);
    }
    .face.cover {
      background: radial-gradient(circle at center, #6b111c 0%, #2b060a 100%);
      color: var(--gold-bright);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }
    .face.back {
      transform: rotateY(180deg);
      background: linear-gradient(135deg, #2b090c, #4a1217);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-size: 1.1rem;
    }
    .sheet.flipped { transform: rotateY(-165deg); }

    /* Cover Design */
    .koi-emblem {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: radial-gradient(circle, #184e59 0%, #0d2c33 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0.9rem 0;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
    }
    .cover-box {
      border-top: 1.5px solid var(--gold);
      border-bottom: 1.5px solid var(--gold);
      padding: 0.45rem 1.4rem;
      font-family: Georgia, serif;
      letter-spacing: 0.18em;
      font-size: 0.95rem;
      margin: 0.6rem 0;
    }

    /* Menu Page Styling */
    .page-header {
      text-align: center;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 0.4rem;
      margin-bottom: 0.65rem;
    }
    .page-header small {
      display: block;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      color: #8c5e08;
      text-transform: uppercase;
    }
    .page-header h2 {
      font-family: Georgia, serif;
      font-size: 1.25rem;
      color: #6e0f1a;
      letter-spacing: 0.06em;
    }
    .section-tag {
      background: #6e0f1a;
      color: var(--gold-bright);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 0.22rem 0.6rem;
      border-radius: 4px;
      margin: 0.55rem 0 0.45rem;
      text-transform: uppercase;
      display: inline-block;
    }
    .item {
      background: var(--card);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
      margin-bottom: 0.5rem;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 0.88rem;
      color: #590d16;
    }
    .price {
      color: #9e6b05;
      font-weight: 800;
      white-space: nowrap;
      font-size: 0.88rem;
    }
    .desc {
      font-size: 0.73rem;
      color: #4f3a3c;
      margin-top: 0.18rem;
      line-height: 1.32;
    }
    .compact-row {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0.2rem;
      border-bottom: 1px dashed rgba(110, 15, 26, 0.22);
      font-size: 0.82rem;
      font-weight: 600;
      color: #3d161a;
    }

    /* Bottom Navigation */
    .controls { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; width: 100%; }
    .nav { display: flex; gap: 0.7rem; align-items: center; }
    .nav button {
      background: rgba(212, 175, 55, 0.2);
      border: 1px solid var(--gold);
      color: var(--gold-bright);
      padding: 0.45rem 1rem;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    .nav button:disabled { opacity: 0.35; cursor: default; }
  </style>
</head>

const book = document.getElementById("book");
const tabsEl = document.getElementById("tabs");
const label = document.getElementById("label");
let idx = 0;
pages.forEach((p, i) => {
const sheet = document.createElement("div");
sheet.className = "sheet";
sheet.style.zIndex = pages.length - i;
let frontHTML = "";
if (p.isCover) {
frontHTML =  <div class="face cover"> <div style="color:var(--gold);letter-spacing:0.22em;font-size:0.7rem;font-weight:700;">SERENE DINING &amp; TEA HOUSE</div> <h2 style="font-family:Georgia,serif;font-size:2.3rem;color:var(--gold);margin:0.4rem 0;line-height:1.1;">KOI<br><span style="font-size:1.5rem;color:var(--gold-bright);">Garden Cafe</span></h2> <div class="koi-emblem">🎏🪷🎏</div> <div class="cover-box">MENU · EST. 2020</div> <p style="font-size:0.78rem;margin-top:0.8rem;opacity:0.9;line-height:1.4;">Rizal Street, Clarin,<br>Misamis Occidental</p> <p style="font-size:0.7rem;margin-top:1rem;color:var(--gold);">Swipe left or tap Next →</p> </div>;
} else {
const bodyHTML = p.sections.map(sec => {
let html = <div class="section-tag">${sec.name}</div>;
if (sec.items) {
html += sec.items.map(it =>  <div class="item"> <div class="row"><span>${it.n}</span><span class="price">${it.p}</span></div> <div class="desc">${it.d}</div> </div>).join("");
}
if (sec.compact) {
html += sec.compact.map(row =>  <div class="compact-row"><span>${row}</span><span class="price">${row}</span></div>).join("");
}
return html;
}).join("");
frontHTML =  <div class="face"> <div class="page-header"> <small>KOI GARDEN CAFÈ · FOOD MENU</small> <h2>${p.title.toUpperCase()}</h2> </div> ${bodyHTML} </div>;
}
sheet.innerHTML = frontHTML + <div class="face back">✦ KOI GARDEN CAFÈ ✦</div>;
book.appendChild(sheet);
const tab = document.createElement("button");
tab.className = "tab";
tab.textContent = p.title;
tab.onclick = () => go(i);
tabsEl.appendChild(tab);
});
const sheets = document.querySelectorAll(".sheet");
const tabs = document.querySelectorAll(".tab");
function go(n) {
idx = Math.max(0, Math.min(pages.length - 1, n));
sheets.forEach((s, i) => {
s.classList.toggle("flipped", i < idx);
s.style.zIndex = i < idx ? i + 1 : pages.length - i;
});
tabs.forEach((t, i) => {
t.classList.toggle("active", i === idx);
if (i === idx) t.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
});
label.textContent = ${pages[idx].title} · ${idx + 1}/${pages.length};
prevBtn.disabled = idx === 0;
nextBtn.disabled = idx === pages.length - 1;
}
prevBtn.onclick = () => go(idx - 1);
nextBtn.onclick = () => go(idx + 1);
let startX = 0;
document.getElementById("stage").addEventListener("touchstart", e => startX = e.changedTouches.screenX, { passive: true });
document.getElementById("stage").addEventListener("touchend", e => {
const diff = e.changedTouches.screenX - startX;
if (Math.abs(diff) > 35) diff < 0 ? go(idx + 1) : go(idx - 1);
}, { passive: true });
go(0);



### What This Fixes Immediately
* **Zero Loading:** All 10 pages of your PDF are hardcoded directly into the file, so it renders immediately without waiting for slow network downloads.
* **Interactive Flipbook + Category Tabs:** Customers can swipe left/right, tap **Prev / Next**, or tap the top category buttons (**Pork**, **Chicken**, **Beef & Seafood**, **Rice Bowl**, **A La Carte**, **Snacks**, **Pasta & Salad**, **Dessert & Hot**, **Drinks & Wine**) to flip straight to any page.
